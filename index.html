<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動提問系統</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;600;700&display=swap');

  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --accent: #e8ff47;
    --accent2: #47b8ff;
    --accent3: #ff6b6b;
    --purple: #b47aff;
    --text: #f0f0f0;
    --text-muted: #666;
    --text-dim: #999;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* NAV */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(13,13,13,0.95);
    backdrop-filter: blur(12px);
    z-index: 100;
  }
  .nav-logo { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.5px; }
  .nav-logo span { color: var(--accent); }
  .nav-tabs { display: flex; gap: 4px; background: var(--surface); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
  .nav-tab { padding: 8px 18px; border-radius: 7px; border: none; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; font-family: 'Noto Sans TC', sans-serif; }
  .nav-tab.active { background: var(--accent); color: #000; font-weight: 700; }
  .nav-tab:hover:not(.active) { color: var(--text); }
  .nav-count { font-size: 13px; color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; }
  .nav-count strong { color: var(--accent); }

  /* VIEWS */
  .view { display: none; }
  .view.active { display: block; }

  /* SUBMIT */
  .submit-wrap { max-width: 540px; margin: 0 auto; padding: 32px 20px 60px; }
  .submit-hero { text-align: center; margin-bottom: 36px; }
  .submit-hero .eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 12px; }
  .submit-hero h1 { font-size: clamp(26px, 6vw, 36px); font-weight: 900; line-height: 1.15; letter-spacing: -1px; }
  .submit-hero p { margin-top: 10px; color: var(--text-dim); font-size: 14px; line-height: 1.6; }

  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; }
  .form-group { margin-bottom: 20px; }
  .form-label { display: block; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }

  input[type="text"] { width: 100%; background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: 'Noto Sans TC', sans-serif; font-size: 15px; padding: 13px 16px; transition: border-color 0.2s; outline: none; }
  input[type="text"]::placeholder { color: var(--text-muted); }
  input[type="text"]:focus { border-color: var(--accent); }

  /* Role cards */
  .role-grid { display: flex; flex-direction: column; gap: 10px; }
  .role-btn { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: var(--radius); border: 1.5px solid var(--border); background: var(--surface2); color: var(--text-dim); font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.18s; font-family: 'Noto Sans TC', sans-serif; text-align: left; }
  .role-btn .role-icon { font-size: 22px; flex-shrink: 0; }
  .role-btn .role-label { flex: 1; }
  .role-btn .role-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; transition: all 0.18s; }
  .role-btn:hover { border-color: var(--accent); color: var(--text); }
  .role-btn.selected { border-color: var(--accent); background: rgba(232,255,71,0.07); color: var(--text); }
  .role-btn.selected .role-check { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,255,71,0.2); }

  textarea { width: 100%; background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: 'Noto Sans TC', sans-serif; font-size: 15px; line-height: 1.6; padding: 14px 16px; resize: vertical; min-height: 120px; transition: border-color 0.2s; outline: none; }
  textarea::placeholder { color: var(--text-muted); }
  textarea:focus { border-color: var(--accent); }

  .char-count { text-align: right; font-size: 11px; color: var(--text-muted); margin-top: 6px; }
  .char-count.warn { color: var(--accent3); }

  .submit-btn { width: 100%; padding: 16px; background: var(--accent); color: #000; border: none; border-radius: var(--radius); font-size: 16px; font-weight: 900; cursor: pointer; transition: all 0.2s; font-family: 'Noto Sans TC', sans-serif; margin-top: 8px; }
  .submit-btn:hover { background: #d4eb00; transform: translateY(-1px); }
  .submit-btn:active { transform: translateY(0); }

  .success-msg { display: none; text-align: center; padding: 32px 20px; }
  .success-msg .checkmark { font-size: 48px; margin-bottom: 16px; }
  .success-msg h2 { font-size: 22px; font-weight: 900; margin-bottom: 8px; }
  .success-msg p { color: var(--text-dim); font-size: 14px; }
  .submit-again { margin-top: 20px; padding: 10px 24px; border: 1.5px solid var(--border); background: transparent; color: var(--text); border-radius: 8px; font-size: 14px; cursor: pointer; transition: all 0.2s; font-family: 'Noto Sans TC', sans-serif; }
  .submit-again:hover { border-color: var(--accent); color: var(--accent); }

  /* DISPLAY / PROJECT */
  .display-wrap { max-width: 960px; margin: 0 auto; padding: 32px 24px 60px; }
  .display-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  .display-header h2 { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
  .display-header h2 span { color: var(--accent); }

  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; align-items: center; }
  .filter-btn { padding: 7px 16px; border-radius: 20px; border: 1.5px solid var(--border); background: transparent; color: var(--text-dim); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; font-family: 'Noto Sans TC', sans-serif; }
  .filter-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .filter-btn.active { background: var(--accent2); border-color: var(--accent2); color: #000; font-weight: 700; }
  .clear-btn { margin-left: auto; padding: 7px 16px; border-radius: 20px; border: 1.5px solid var(--accent3); background: transparent; color: var(--accent3); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: 'Noto Sans TC', sans-serif; }
  .clear-btn:hover { background: var(--accent3); color: #fff; }
  .refresh-btn { padding: 8px 18px; border: 1.5px solid var(--border); background: transparent; color: var(--text-dim); border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.2s; font-family: 'Noto Sans TC', sans-serif; }
  .refresh-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  .questions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

  .q-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; transition: all 0.2s; position: relative; overflow: hidden; animation: fadeUp 0.3s ease both; }
  .q-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; opacity: 0; transition: opacity 0.2s; }
  .q-card:hover { border-color: #333; transform: translateY(-2px); }
  .q-card:hover::before { opacity: 1; }
  .q-card[data-role="專案經理"]::before { background: var(--accent2); }
  .q-card[data-role="產品經理"]::before { background: var(--accent); }
  .q-card[data-role="資料分析/資料科學"]::before { background: var(--purple); }

  .q-tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 10px; }
  .role-pm  { background: rgba(71,184,255,0.15); color: var(--accent2); }
  .role-po  { background: rgba(232,255,71,0.15); color: var(--accent); }
  .role-da  { background: rgba(180,120,255,0.15); color: var(--purple); }

  .q-name { font-size: 12px; font-weight: 700; color: var(--text-dim); margin-bottom: 8px; }
  .q-body { font-size: 15px; line-height: 1.65; color: var(--text); }
  .q-meta { margin-top: 14px; font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
  .q-num { background: var(--surface2); border: 1px solid var(--border); width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--text-dim); flex-shrink: 0; }

  .empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); grid-column: 1/-1; }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
  .empty-state p { font-size: 15px; line-height: 1.6; }

  /* Projector */
  #view-project .display-wrap { max-width: 100%; padding: 40px 48px; }
  #view-project .questions-grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
  #view-project .q-card { padding: 24px; }
  #view-project .q-body { font-size: 18px; line-height: 1.7; }
  #view-project .q-tag { font-size: 13px; padding: 4px 12px; }
  #view-project .display-header h2 { font-size: 28px; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 480px) {
    .nav { padding: 12px 16px; }
    .nav-count { display: none; }
    .submit-wrap { padding: 24px 16px 60px; }
    .form-card { padding: 20px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">ask<span>.</span></div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchView('submit',this)">📝 提問</button>
    <button class="nav-tab" onclick="switchView('display',this)">📋 管理</button>
    <button class="nav-tab" onclick="switchView('project',this)">🖥 投影</button>
  </div>
  <div class="nav-count">共 <strong id="total-count">0</strong> 則提問</div>
</nav>

<!-- SUBMIT -->
<div class="view active" id="view-submit">
  <div class="submit-wrap">
    <div class="submit-hero">
      <div class="eyebrow">Ask Away</div>
      <h1>你有什麼想問的？</h1>
      <p>選擇職務方向，送出你的問題<br>分享者會在 Q&amp;A 時間統一回覆</p>
    </div>

    <div class="form-card" id="form-area">
      <div class="form-group">
        <label class="form-label">你的姓名</label>
        <input type="text" id="name-input" placeholder="請輸入你的姓名" maxlength="30">
      </div>

      <div class="form-group">
        <label class="form-label">選擇你的 Coffee Chat 主題</label>
        <div class="role-grid">
          <button class="role-btn" data-role="專案經理" onclick="selectRole(this)">
            <span class="role-icon">📋</span>
            <span class="role-label">專案經理</span>
            <span class="role-check"></span>
          </button>
          <button class="role-btn" data-role="產品經理" onclick="selectRole(this)">
            <span class="role-icon">🚀</span>
            <span class="role-label">產品經理</span>
            <span class="role-check"></span>
          </button>
          <button class="role-btn" data-role="資料分析/資料科學" onclick="selectRole(this)">
            <span class="role-icon">📊</span>
            <span class="role-label">資料分析 ／ 資料科學</span>
            <span class="role-check"></span>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">你的問題</label>
        <textarea id="q-input" placeholder="請輸入你想問的問題…" maxlength="300" oninput="updateChar()"></textarea>
        <div class="char-count" id="char-count">0 / 300</div>
      </div>

      <button class="submit-btn" onclick="submitQ()">送出提問 →</button>
    </div>

    <div class="success-msg" id="success-msg">
      <div class="checkmark">✅</div>
      <h2>提問已送出！</h2>
      <p>感謝你的問題<br>分享者會在 Q&amp;A 時間統一回覆</p>
      <button class="submit-again" onclick="resetForm()">再提一個問題</button>
    </div>
  </div>
</div>

<!-- DISPLAY -->
<div class="view" id="view-display">
  <div class="display-wrap">
    <div class="display-header">
      <h2>所有提問 <span id="display-count">(0)</span></h2>
      <button class="refresh-btn" onclick="renderQuestions('display')">↻ 重新整理</button>
    </div>
    <div class="filter-row" id="filter-row-display">
      <button class="filter-btn active" data-tag="all" onclick="filterQ(this,'display')">全部</button>
      <button class="filter-btn" data-tag="專案經理" onclick="filterQ(this,'display')">📋 專案經理</button>
      <button class="filter-btn" data-tag="產品經理" onclick="filterQ(this,'display')">🚀 產品經理</button>
      <button class="filter-btn" data-tag="資料分析/資料科學" onclick="filterQ(this,'display')">📊 資料分析／資料科學</button>
      <button class="clear-btn" onclick="clearAll()">🗑 清除全部</button>
    </div>
    <div class="questions-grid" id="grid-display"></div>
  </div>
</div>

<!-- PROJECTOR -->
<div class="view" id="view-project">
  <div class="display-wrap">
    <div class="display-header">
      <h2>Q&amp;A 提問牆 <span id="project-count">(0)</span></h2>
      <button class="refresh-btn" onclick="renderQuestions('project')">↻ 重新整理</button>
    </div>
    <div class="filter-row" id="filter-row-project">
      <button class="filter-btn active" data-tag="all" onclick="filterQ(this,'project')">全部</button>
      <button class="filter-btn" data-tag="專案經理" onclick="filterQ(this,'project')">📋 專案經理</button>
      <button class="filter-btn" data-tag="產品經理" onclick="filterQ(this,'project')">🚀 產品經理</button>
      <button class="filter-btn" data-tag="資料分析/資料科學" onclick="filterQ(this,'project')">📊 資料分析／資料科學</button>
    </div>
    <div class="questions-grid" id="grid-project"></div>
  </div>
</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzsuhXxo03B5ZRQz-JeQOm3aqahpL1y7ymcdLsDuB943mWyRtuCWi3okmRyWTok6ijIaA/exec';
  const POLL_INTERVAL = 5000; // 每 5 秒自動更新

  let selectedRole = '';
  let activeFilter = { display: 'all', project: 'all' };
  let cachedQs = [];
  let pollTimer = null;

  // ── Nav ──
  function switchView(v, btn) {
    document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
    document.getElementById('view-' + v).classList.add('active');
    btn.classList.add('active');
    if (v !== 'submit') {
      fetchAndRender(v);
      startPolling(v);
    } else {
      stopPolling();
    }
  }

  // ── Polling ──
  function startPolling(view) {
    stopPolling();
    pollTimer = setInterval(() => fetchAndRender(view), POLL_INTERVAL);
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  // ── Fetch from Google Sheets ──
  async function fetchAndRender(view) {
    try {
      const res = await fetch(GAS_URL);
      const data = await res.json();
      // data = array of {timestamp, name, role, body}
      cachedQs = data.filter(r => r.name && r.role && r.body);
      updateTotalCount();
      renderQuestions(view);
    } catch (e) {
      console.error('Fetch error', e);
    }
  }

  // ── Role selection ──
  function selectRole(btn) {
    document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedRole = btn.dataset.role;
  }

  // ── Char count ──
  function updateChar() {
    const val = document.getElementById('q-input').value;
    const el = document.getElementById('char-count');
    el.textContent = val.length + ' / 300';
    el.classList.toggle('warn', val.length > 260);
  }

  // ── Submit to Google Sheets ──
  async function submitQ() {
    const name = document.getElementById('name-input').value.trim();
    const text = document.getElementById('q-input').value.trim();
    if (!name) { alert('請輸入你的姓名'); return; }
    if (!selectedRole) { alert('請選擇職務方向'); return; }
    if (!text) { alert('請輸入你的問題'); return; }

    const btn = document.querySelector('.submit-btn');
    btn.disabled = true;
    btn.textContent = '送出中…';

    try {
      await fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, role: selectedRole, body: text })
      });
      // no-cors 無法讀回應，假設成功
      document.getElementById('form-area').style.display = 'none';
      document.getElementById('success-msg').style.display = 'block';
    } catch (e) {
      alert('送出失敗，請檢查網路連線後再試');
    } finally {
      btn.disabled = false;
      btn.textContent = '送出提問 →';
    }
  }

  // ── Reset form ──
  function resetForm() {
    document.getElementById('name-input').value = '';
    document.getElementById('q-input').value = '';
    document.getElementById('char-count').textContent = '0 / 300';
    document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('selected'));
    selectedRole = '';
    document.getElementById('form-area').style.display = 'block';
    document.getElementById('success-msg').style.display = 'none';
  }

  // ── Filter ──
  function filterQ(btn, view) {
    document.getElementById('filter-row-' + view).querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter[view] = btn.dataset.tag;
    renderQuestions(view);
  }

  // ── Manual refresh ──
  function renderQuestions(view) {
    const tag = activeFilter[view] || 'all';
    const filtered = tag === 'all' ? cachedQs : cachedQs.filter(q => q.role === tag);

    const grid = document.getElementById('grid-' + view);
    const countEl = document.getElementById(view === 'display' ? 'display-count' : 'project-count');
    countEl.textContent = '(' + filtered.length + ')';

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state"><div class="icon">💬</div><p>還沒有提問<br>等待學員掃碼送出問題</p></div>`;
      return;
    }

    grid.innerHTML = filtered.map((q, i) => `
      <div class="q-card" data-role="${escHtml(q.role)}" style="animation-delay:${i*0.04}s">
        <span class="q-tag ${roleClass(q.role)}">${roleEmoji(q.role)} ${escHtml(q.role)}</span>
        <div class="q-name">👤 ${escHtml(q.name)}</div>
        <div class="q-body">${escHtml(q.body)}</div>
        <div class="q-meta">
          <span class="q-num">${i+1}</span>
          <span>${escHtml(String(q.timestamp || ''))}</span>
        </div>
      </div>`).join('');
  }

  // ── Clear (只清本地快取顯示，實際資料在 Sheets 需手動刪除） ──
  function clearAll() {
    if (!confirm('確定要清除畫面顯示？\n（Google Sheets 中的資料請手動刪除）')) return;
    cachedQs = [];
    updateTotalCount();
    renderQuestions('display');
  }

  // ── Utils ──
  function updateTotalCount() {
    document.getElementById('total-count').textContent = cachedQs.length;
  }
  function roleClass(role) {
    if (role === '專案經理') return 'role-pm';
    if (role === '產品經理') return 'role-po';
    return 'role-da';
  }
  function roleEmoji(role) {
    return {'專案經理':'📋','產品經理':'🚀','資料分析/資料科學':'📊'}[role] || '💬';
  }
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
